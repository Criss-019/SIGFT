server:
  port: 8083


spring:
  application:
    name: seguridad-ms
  datasource:
    url: jdbc:mysql://localhost:3306/seguridad_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

# JWT — en producción sobreescribir con variable de entorno JWT_SECRET
app:
  jwt:
    secret: ${JWT_SECRET:c2lnZnQtc2VjcmV0LWtleS1wYXJhLWRlc2Fycm9sbG8tMjAyNS1taW5pbW8tMzJieXRlcw==}
    expiration-ms: 86400000  # 24 horas

logging:
  level:
    cl.duoc.sigft.seguridad_ms: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
