server:
  port: ${SERVER_PORT:8084}


spring:
  application:
    name: reportes-ms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/reportes_db?createDatabaseIfNotExist=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    cl.duoc.sigft.reportes_ms: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
