server:
  port: 8085
  servlet:
    context-path: /api/v1/integracion-ms

spring:
  application:
    name: integracion-ms
  datasource:
    url: jdbc:mysql://localhost:3306/integracion_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    cl.duoc.sigft.integracion_ms: INFO

# URL simulada de API Argentina (R.6)
integracion:
  aduana-argentina:
    url: https://api.aduana.gob.ar/v1
    timeout-ms: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
