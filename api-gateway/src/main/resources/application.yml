server:
  port: ${SERVER_PORT:8080} # Railway inyecta PORT automáticamente

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CONFIGURACIÓN GLOBAL DE CORS (Para Angular/React)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "${FRONTEND_URL:http://localhost:5173}" # URL pública Railway del frontend
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      # DEFINICIÓN DE RUTAS HACIA LOS 5 MICROSERVICIOS
      routes:
        # 1. Módulo Gestor de Trámites
        - id: tramites-ms-route
          uri: lb://TRAMITES-MS
          predicates:
            - Path=/api/v1/tramites/**, /api/v1/declaraciones-sag/**, /api/v1/autorizaciones-notariales/**

        # 2. Módulo de Pasajeros y Vehículos
        - id: pasajeros-ms-route
          uri: lb://PASAJEROS-MS
          predicates:
            - Path=/api/v1/pasajeros/**, /api/v1/vehiculos/**

        # 3. Motor de Reportes
        - id: reportes-ms-route
          uri: lb://REPORTES-MS
          predicates:
            - Path=/api/v1/reportes/**

        # 4. Módulo de Seguridad y Autenticación
        - id: seguridad-ms-route
          uri: lb://SEGURIDAD-MS
          predicates:
            - Path=/api/v1/usuarios/**, /api/v1/funcionarios/**

        # 5. API de Integración Internacional
        - id: integracion-ms-route
          uri: lb://INTEGRACION-MS
          predicates:
            - Path=/api/v1/integracion/**

# CONFIGURACIÓN DE CONEXIÓN CON EUREKA SERVER
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"